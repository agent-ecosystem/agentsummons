[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsummons"
# Placeholder: build_wheels.py stamps the release version into a temp copy.
version = "0.0.0"
description = "Invokes agent harnesses (Antigravity CLI, Claude Code, Codex CLI) headlessly. Python wrapper around the agentsummons Go CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dachary Carey" }]
requires-python = ">=3.9"
keywords = ["agent", "harness", "claude-code", "codex", "antigravity", "headless"]

[project.urls]
Homepage = "https://github.com/agent-ecosystem/agentsummons"
Repository = "https://github.com/agent-ecosystem/agentsummons"

[project.scripts]
agentsummons = "agentsummons:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentsummons = ["bin/*"]
