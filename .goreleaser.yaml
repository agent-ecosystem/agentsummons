version: 2

release:
  github:
    owner: agent-ecosystem
    name: agentsummons

# Release notes come from CHANGELOG.md: the workflow extracts the tag's
# section and passes it via --release-notes, so the generated commit-list
# changelog is off.
changelog:
  disable: true

# goreleaser's default ldflags stamp main.version with the tag, so
# `agentsummons --version` reports the release without a hardcoded
# constant to bump.
builds:
  - binary: agentsummons
    main: ./cmd/agentsummons
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# brews is deprecated upstream in favor of homebrew_casks, but casks are
# macOS-only and get Gatekeeper quarantine on unsigned binaries; a formula
# also works on Linux Homebrew and matches the tap's existing Formula/
# layout (skill-validator). Revisit if goreleaser v2 drops it.
brews:
  - directory: Formula
    repository:
      owner: agent-ecosystem
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/agent-ecosystem/agentsummons
    description: Invoke agent harnesses (Antigravity CLI, Claude Code, Codex CLI) headlessly
    license: MIT
    install: |
      bin.install "agentsummons"
    test: |
      assert_match version.to_s, shell_output("#{bin}/agentsummons --version")
